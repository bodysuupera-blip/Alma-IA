
name: ALMA IA 6.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compilar ALMA IA 6.0
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -1)
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Instalar Android SDK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair ALMA IA 6.0
        run: |
          set -euo pipefail
          ZIP="ALMA_IA_6_0_PROJETO_ANDROID.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: envie o ZIP ALMA IA 6.0 para o GitHub."
            exit 1
          fi

          mkdir -p projeto
          unzip -oq "$ZIP" -d projeto

      - name: Verificar projeto
        run: |
          set -euo pipefail
          test -f projeto/settings.gradle
          test -f projeto/build.gradle
          test -f projeto/app/build.gradle
          test -f projeto/app/src/main/assets/index.html
          test -f projeto/app/src/main/AndroidManifest.xml
          echo "Projeto ALMA IA 6.0 localizado!"

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace \
            -p projeto assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-6.0-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
