
name: ALMA IA 3.0 - VOZ NEURAL

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extraido

          ZIP=$(find . -type f \
            -iname 'ALMA_IA_3_0_VOZ_NEURAL_CORRIGIDO.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Envie primeiro o ZIP para o repositorio."
            exit 1
          fi

          unzip -oq "$ZIP" -d extraido

          SETTINGS=$(find extraido -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          test -f "$ROOT/app/build.gradle"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $ROOT"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar motor de voz
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p app/libs
          mkdir -p app/src/main/assets/tts_model
          mkdir -p /tmp/alma-voice

          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar \
            -o app/libs/sherpa-onnx-2.0.3.aar

          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-dii-high.tar.bz2 \
            -o /tmp/alma-voice/model.tar.bz2

          tar -xjf /tmp/alma-voice/model.tar.bz2 \
            -C /tmp/alma-voice

          MODEL=$(find /tmp/alma-voice \
            -name 'pt_BR-dii-high.onnx' -print -quit)

          test -n "$MODEL"

          cp -a "$(dirname "$MODEL")"/. \
            app/src/main/assets/tts_model/

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-3.0-VOZ-NEURAL
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
