
name: NEXUS 350 - 150 FASES MANIFEST FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair fonte
        id: source
        run: |
          set -e

          ZIP="Nexus350_150_FASES_FULLSCREEN_ICON_REDONDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP não encontrado"
            ls -la
            exit 1
          fi

          rm -rf fonte_extraida
          mkdir -p fonte_extraida
          unzip -oq "$ZIP" -d fonte_extraida

          PACKAGE=$(find fonte_extraida -type f -name package.json | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Fonte: $PROJECT_DIR"

      - name: Instalar dependências
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm install

      - name: Preparar Android
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npx cap sync android

      - name: Corrigir Manifest com XML seguro
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -e
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()

          ns = "http://schemas.android.com/apk/res/android"
          orientation = f"{{{ns}}}screenOrientation"

          app = root.find("application")
          if app is None:
              raise SystemExit("Tag application não encontrada")

          activities = list(app.findall("activity")) + list(app.findall("activity-alias"))
          launcher = []

          for activity in activities:
              for intent in activity.findall("intent-filter"):
                  actions = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("action")
                  ]
                  categories = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("category")
                  ]

                  if "android.intent.action.MAIN" in actions and \
                     "android.intent.category.LAUNCHER" in categories:
                      launcher.append(activity)

          if not launcher:
              raise SystemExit("Activity launcher não encontrada")

          for activity in launcher:
              activity.set(orientation, "landscape")

          ET.register_namespace("android", ns)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Confirma que o Manifest continua sendo XML válido
          ET.parse(manifest)

          print("Manifest validado: orientação horizontal")
          PY

      - name: Compilar APK
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-150Fases-Landscape
          path: ${{ steps.source.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
