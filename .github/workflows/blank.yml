
name: NEXUS 350 - APK 100 FASES (FONTE NOVA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar fonte
        run: |
          set -e
          if [ ! -f package.json ]; then
            echo "ERRO: package.json nao encontrado na raiz."
            ls -la
            exit 1
          fi

          echo "Fonte encontrada:"
          cat package.json

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-100Fases
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
