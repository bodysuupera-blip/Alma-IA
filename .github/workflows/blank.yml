
name: MENTEX NEXT - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          echo "Procurando projeto Android..."

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "*/.gradle/*" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: Nenhum settings.gradle encontrado."
            echo "Arquivos existentes no repositório:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: Pasta app não encontrada no projeto:"
            echo "$PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.projeto.outputs.project_dir }}" \
            clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-NEXT-APK
          path: ${{ steps.projeto.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
