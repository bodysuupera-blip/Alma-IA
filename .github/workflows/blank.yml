
name: ALMA IA V2.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar ALMA IA 2.0
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto V2
        run: |
          set -e
          ZIP=$(find . -name "ALMA_IA_V2_PROJETO_ANDROID.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP ALMA IA V2 não encontrado!"
            exit 1
          fi
          unzip -o "$ZIP" -d projeto-extraido
          cp -a projeto-extraido/. .

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estrutura
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
