
name: ALMA IA 3.0 - VOZ NEURAL CORRIGIDA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          if [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "ERRO: app/build.gradle nao encontrado"
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"
          echo "Projeto localizado: $ROOT"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar Sherpa ONNX e voz brasileira
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p app/libs
          mkdir -p app/src/main/assets/tts_model
          mkdir -p /tmp/alma-voice

          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar \
            -o app/libs/sherpa-onnx-2.0.3.aar

          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-dii-high.tar.bz2 \
            -o /tmp/alma-voice/model.tar.bz2

          tar -xjf /tmp/alma-voice/model.tar.bz2 \
            -C /tmp/alma-voice

          MODEL=$(find /tmp/alma-voice \
            -name 'pt_BR-dii-high.onnx' -print -quit)

          if [ -z "$MODEL" ]; then
            echo "Modelo de voz nao encontrado"
            exit 1
          fi

          cp -a "$(dirname "$MODEL")"/. \
            app/src/main/assets/tts_model/

          test -f app/src/main/assets/tts_model/pt_BR-dii-high.onnx
          test -f app/src/main/assets/tts_model/tokens.txt
          test -d app/src/main/assets/tts_model/espeak-ng-data

      - name: Compilar ALMA IA 3.0
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-3.0-VOZ-NEURAL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
