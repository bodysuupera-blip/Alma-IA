
name: NEXUS 350 - REBUILD REAL 150 FASES

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar fonte nova
        run: |
          set -e

          test -f package.json || {
            echo "ERRO: package.json ausente na raiz"
            ls -la
            exit 1
          }

          test -f www/index.html || {
            echo "ERRO: www/index.html ausente"
            exit 1
          }

          test -f www/game.js || {
            echo "ERRO: www/game.js ausente"
            exit 1
          }

          echo "Fonte REBUILD encontrada"

      - name: Instalar dependências
        run: npm install

      - name: Preparar Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Android
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()

          ns = "http://schemas.android.com/apk/res/android"
          attr = f"{{{ns}}}screenOrientation"

          app = root.find("application")
          if app is None:
              raise SystemExit("Application não encontrada")

          for activity in app.findall("activity"):
              for intent in activity.findall("intent-filter"):
                  actions = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("action")
                  ]
                  categories = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN" in actions
                      and "android.intent.category.LAUNCHER" in categories
                  ):
                      activity.set(attr, "landscape")

          ET.register_namespace("android", ns)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          ET.parse(p)

          print("Orientação horizontal configurada")
          PY

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-REBUILD-150-FASES-NEWGAME
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
