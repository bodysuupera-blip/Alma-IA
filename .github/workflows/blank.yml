
name: MENTEX - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Instalar SDK Android 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extrair projeto MENTEX
        run: |
          if [ ! -f "MENTEX_PROJETO_250_DESAFIOS.zip" ]; then
            echo "ERRO: ZIP do MENTEX não encontrado!"
            ls -la
            exit 1
          fi

          mkdir -p projeto
          unzip -o MENTEX_PROJETO_250_DESAFIOS.zip -d projeto

      - name: Localizar estrutura Android
        id: projeto
        shell: bash
        run: |
          SETTINGS=$(find projeto -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            find projeto -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: build.gradle do aplicativo não encontrado!"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar MENTEX
        run: |
          gradle --no-daemon \
            -p "${{ steps.projeto.outputs.project_dir }}" \
            clean assembleDebug

      - name: Verificar APK
        run: |
          APK="${{ steps.projeto.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: ${{ steps.projeto.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
