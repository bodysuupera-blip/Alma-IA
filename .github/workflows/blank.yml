
name: ALMA IA 3.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar ALMA IA 3.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar projeto ALMA IA
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/almaia/app/MainActivity.java
          test -f app/src/main/assets/augusto.jpg
          test -f app/src/main/assets/helena.jpg
          test -f app/src/main/assets/gabriel.jpg
          echo "Projeto ALMA IA 3.0 identificado."

      - name: Compilar aplicativo Android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK gerado com sucesso!"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
