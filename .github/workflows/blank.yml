
name: ALMA IA 3.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  compilar:
    name: Compilador ALMA IA 3.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair ALMA IA 3.0
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ALMA_IA_V3_0_TEXTO_COM_RECONHECIMENTO_VOZ.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP da versão 3.0 não encontrado."
            exit 1
          fi

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

          echo "Projeto descompactado!"

      - name: Verificar arquivos Android
        shell: bash
        run: |
          set -euo pipefail

          test -f projeto/settings.gradle
          test -f projeto/build.gradle
          test -f projeto/app/build.gradle
          test -f projeto/app/src/main/AndroidManifest.xml
          test -f projeto/app/src/main/assets/index.html
          test -f projeto/app/src/main/java/com/almaia/app/MainActivity.java

          test -f projeto/app/src/main/assets/augusto.jpg
          test -f projeto/app/src/main/assets/helena.jpg
          test -f projeto/app/src/main/assets/gabriel.jpg

          echo "ALMA IA 3.0 verificado!"

      - name: Compilar aplicativo
        run: |
          gradle --no-daemon --stacktrace \
            -p projeto assembleDebug

      - name: Conferir APK
        run: |
          test -s projeto/app/build/outputs/apk/debug/app-debug.apk
          echo "APK gerado com sucesso!"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-3.0-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
