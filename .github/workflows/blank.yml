
name: MENTEX NEXT - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verificar estrutura do projeto
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Compilar APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-NEXT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
