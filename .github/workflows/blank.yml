
name: ALMA IA 3.0 - Voz Neural e APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar motor Sherpa-ONNX e voz pt-BR
        run: |
          set -euo pipefail

          mkdir -p app/libs app/src/main/assets/tts_model /tmp/alma-voice

          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar \
            -o app/libs/sherpa-onnx-2.0.3.aar

          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-dii-high.tar.bz2 \
            -o /tmp/alma-voice/model.tar.bz2

          tar -xjf /tmp/alma-voice/model.tar.bz2 -C /tmp/alma-voice

          MODEL_DIR=$(find /tmp/alma-voice -type f \
            -name 'pt_BR-dii-high.onnx' -print -quit | xargs dirname)

          test -n "$MODEL_DIR"

          cp -a "$MODEL_DIR"/. app/src/main/assets/tts_model/

          test -f app/src/main/assets/tts_model/pt_BR-dii-high.onnx
          test -f app/src/main/assets/tts_model/tokens.txt
          test -d app/src/main/assets/tts_model/espeak-ng-data

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-3.0-APK-VOZ-NEURAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
