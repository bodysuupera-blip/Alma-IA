
name: NEXUS 350 - APK 100 FASES JAVA 21

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar Java
        run: java -version

      - name: Localizar e extrair fonte
        run: |
          set -e

          ZIP="Nexus350_FONTE_NOVA_100_FASES.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ZIP da fonte não encontrado"
            exit 1
          fi

          mkdir -p fonte_extraida
          unzip -oq "$ZIP" -d fonte_extraida

          PACKAGE=$(find fonte_extraida -name package.json | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Fonte encontrada: $PROJECT_DIR"

      - name: Instalar dependências
        working-directory: fonte_extraida
        run: npm install

      - name: Preparar Android
        working-directory: fonte_extraida
        run: |
          npx cap add android

      - name: Sincronizar Capacitor
        working-directory: fonte_extraida
        run: npx cap sync android

      - name: Compilar APK
        working-directory: fonte_extraida/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-100Fases
          path: fonte_extraida/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
