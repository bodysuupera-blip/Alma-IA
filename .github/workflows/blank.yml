
name: NEXUS 350 - ORIGINAL FEATURES 150 FASES FIX

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair ZIP e localizar fonte automaticamente
        id: source
        run: |
          set -e

          ZIP="Nexus350_ORIGINAL_FEATURES_150_PHASES.zip"

          test -f "$ZIP" || {
            echo "ZIP não encontrado: $ZIP"
            ls -lh *.zip
            exit 1
          }

          rm -rf fonte_nexus
          mkdir fonte_nexus
          unzip -oq "$ZIP" -d fonte_nexus

          PACKAGE=$(find fonte_nexus -type f -name package.json | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não existe dentro do ZIP"
            find fonte_nexus -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          test -f "$PROJECT_DIR/www/index.html" || {
            echo "index.html não encontrado na fonte"
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          }

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Fonte selecionada: $PROJECT_DIR"
          cat "$PACKAGE"

      - name: Instalar dependências
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm install

      - name: Preparar Capacitor Android
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npx cap add android

      - name: Sincronizar Android
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npx cap sync android

      - name: Configurar orientação horizontal
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -e
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()

          ns = "http://schemas.android.com/apk/res/android"
          attr = f"{{{ns}}}screenOrientation"

          app = root.find("application")
          if app is None:
              raise SystemExit("application não encontrada")

          found = False

          for activity in app.findall("activity"):
              for intent in activity.findall("intent-filter"):
                  actions = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("action")
                  ]
                  categories = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN" in actions
                      and "android.intent.category.LAUNCHER" in categories
                  ):
                      activity.set(attr, "landscape")
                      found = True

          if not found:
              raise SystemExit("Activity Launcher não encontrada")

          ET.register_namespace("android", ns)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          ET.parse(p)

          print("Manifest validado e horizontal configurado")
          PY

      - name: Compilar APK
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-150-Fases-APK
          path: ${{ steps.source.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
