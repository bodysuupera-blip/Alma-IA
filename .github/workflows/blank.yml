
name: NEXUS 350 - ORIGINAL FEATURES 150 FASES

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair fonte Nexus 350
        run: |
          set -e

          ZIP="Nexus350_ORIGINAL_FEATURES_150_PHASES.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP atualizado não encontrado"
            ls -lh *.zip
            exit 1
          fi

          rm -rf fonte_nexus
          mkdir -p fonte_nexus
          unzip -oq "$ZIP" -d fonte_nexus

          test -f fonte_nexus/package.json || {
            echo "ERRO: package.json não encontrado dentro do ZIP"
            find fonte_nexus -maxdepth 4 -type f
            exit 1
          }

          test -f fonte_nexus/www/index.html || {
            echo "ERRO: index.html não encontrado"
            exit 1
          }

          echo "Fonte Nexus 350 extraída"

      - name: Instalar dependências
        working-directory: fonte_nexus
        run: npm install

      - name: Preparar Android
        working-directory: fonte_nexus
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: fonte_nexus
        run: npx cap sync android

      - name: Configurar orientação horizontal
        working-directory: fonte_nexus
        run: |
          set -e

          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()

          ns = "http://schemas.android.com/apk/res/android"
          attr = f"{{{ns}}}screenOrientation"

          app = root.find("application")
          if app is None:
              raise SystemExit("application não encontrada")

          found = False

          for activity in app.findall("activity"):
              for intent in activity.findall("intent-filter"):
                  actions = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("action")
                  ]
                  categories = [
                      e.get(f"{{{ns}}}name")
                      for e in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN" in actions
                      and "android.intent.category.LAUNCHER" in categories
                  ):
                      activity.set(attr, "landscape")
                      found = True

          if not found:
              raise SystemExit("Activity principal não encontrada")

          ET.register_namespace("android", ns)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)

          print("Orientação horizontal configurada")
          PY

      - name: Compilar APK
        working-directory: fonte_nexus/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-Original-150-Fases
          path: fonte_nexus/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
