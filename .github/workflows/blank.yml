
name: ALMA IA 7.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilador ALMA IA 7.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/build.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "alma7_work/app/build.gradle" ]; then
            echo "PROJECT_DIR=alma7_work" >> "$GITHUB_ENV"
          else
            echo "ERRO: Projeto Android ALMA IA 7.0 não encontrado."
            find . -maxdepth 4 -type f
            exit 1
          fi

      - name: Verificar versão 7.0
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/almaia/app/MainActivity.java"

          grep -q "versionCode 7" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '7.0'" "$PROJECT_DIR/app/build.gradle"

          if grep -q "RECORD_AUDIO" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"; then
            echo "ERRO: Permissão de microfone encontrada."
            exit 1
          fi

          echo "Projeto ALMA IA 7.0 verificado."

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          sha256sum "$APK"
          echo "APK ALMA IA 7.0 gerado com sucesso."

      - name: Publicar APK 7.0
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-7.0-APK-NOVA-VERSAO
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
