
name: NEXUS 350 - CORRIGIR TELA TRAVADA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair fonte corrigida
        run: |
          set -e

          ZIP="Nexus350_CORRIGIR_TELA_TRAVADA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP não encontrado: $ZIP"
            ls -la
            exit 1
          fi

          mkdir -p fonte_extraida
          unzip -oq "$ZIP" -d fonte_extraida

          PACKAGE=$(find fonte_extraida -type f -name package.json | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado"
            find fonte_extraida -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Fonte encontrada em: $PROJECT_DIR"

      - name: Instalar dependências
        working-directory: fonte_extraida
        run: npm install

      - name: Preparar Android
        working-directory: fonte_extraida
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: fonte_extraida
        run: npx cap sync android

      - name: Compilar APK
        working-directory: fonte_extraida/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-TELA-CORRIGIDA
          path: fonte_extraida/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
