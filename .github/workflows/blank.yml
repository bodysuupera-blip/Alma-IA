
name: ALMA IA 7.2 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar ALMA IA 7.2
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto 7.2
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ALMA_IA_7_2_PROFISSIONAL.zip"

          if [ ! -s "$ZIP" ]; then
            echo "ERRO: ZIP da versão 7.2 não encontrado."
            ls -lah
            exit 1
          fi

          rm -rf build_alma72
          mkdir -p build_alma72

          unzip -q "$ZIP" -d build_alma72

          PROJECT="build_alma72"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/backend/server.js"

          grep -q "versionCode 72" "$PROJECT/app/build.gradle"
          grep -q "versionName '7.2'" "$PROJECT/app/build.gradle"

          test -s "$PROJECT/app/src/main/assets/images/augusto.jpg"
          test -s "$PROJECT/app/src/main/assets/images/helena.jpg"
          test -s "$PROJECT/app/src/main/assets/images/gabriel.jpg"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT" >> "$GITHUB_ENV"

          echo "ALMA IA 7.2 verificada."

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK 7.2
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" assembleDebug

      - name: Conferir APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK ALMA IA 7.2:"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK 7.2
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-7.2-APK-PROFISSIONAL
          path: build_alma72/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
