
name: ALMA - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        id: projeto
        run: |
          DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)

          if [ -z "$DIR" ] || [ "$DIR" = "." ]; then
            DIR="."
          fi

          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Projeto encontrado em: $DIR"
          ls -la "$DIR"

      - name: Preparar Gradle
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle Wrapper encontrado"
          else
            echo "Gradle Wrapper não encontrado. Usando Gradle instalado."
          fi

      - name: Construir APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
