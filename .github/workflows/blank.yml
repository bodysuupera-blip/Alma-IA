
name: NEXUS 350 - 150 FASES FULLSCREEN ICON REDONDO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair fonte atual
        run: |
          set -e
          ZIP="Nexus350_150_FASES_FULLSCREEN_ICON_REDONDO.zip"
          test -f "$ZIP" || { echo "ZIP não encontrado"; ls -la; exit 1; }
          rm -rf fonte_extraida
          mkdir fonte_extraida
          unzip -oq "$ZIP" -d fonte_extraida
          test -f fonte_extraida/package.json || {
            echo "package.json não encontrado"
            exit 1
          }
          grep -q '150' fonte_extraida/www/index.html || {
            echo "Validação das 150 fases falhou"
            exit 1
          }

      - name: Instalar dependências
        working-directory: fonte_extraida
        run: npm install

      - name: Adicionar Android
        working-directory: fonte_extraida
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: fonte_extraida
        run: npx cap sync android

      - name: Configurar horizontal, tela cheia e ícone
        working-directory: fonte_extraida/android
        run: |
          set -e
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          manifest=Path('app/src/main/AndroidManifest.xml')
          txt=manifest.read_text()

          txt=re.sub(
            r'android:screenOrientation="[^"]*"',
            'android:screenOrientation="landscape"',
            txt
          )

          if 'android:screenOrientation=' not in txt:
            txt=txt.replace(
              '<activity',
              '<activity android:screenOrientation="landscape"',
              1
            )

          txt=txt.replace(
            'android:icon="@mipmap/ic_launcher"',
            'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"'
          )
          manifest.write_text(txt)

          # Tela imersiva
          main=Path('app/src/main/java')
          java_files=list(main.rglob('MainActivity.java'))

          if java_files:
            p=java_files[0]
            s=p.read_text()

            if 'IMMERSIVE_STICKY' not in s:
              imports=[
                'import android.os.Bundle;',
                'import android.view.View;',
                'import android.view.WindowManager;'
              ]

              missing=[imp for imp in imports if imp not in s]

              if missing:
                s=re.sub(
                  r'(package [^;]+;\s*)',
                  r'\1\n'+'\n'.join(missing)+'\n',
                  s,
                  count=1
                )

              s=s.replace(
                'public class MainActivity extends BridgeActivity {',
                '''public class MainActivity extends BridgeActivity {
          @Override
          public void onCreate(Bundle savedInstanceState) {
            super.onCreate(savedInstanceState);
            getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
            getWindow().getDecorView().setSystemUiVisibility(
              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
              View.SYSTEM_UI_FLAG_FULLSCREEN |
              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
            );
          }
          '''
              )
              p.write_text(s)

          # Criar ícones redondos em todas as densidades Android
          icon=Image.open('../icon-round.png').convert('RGBA')

          sizes={
            'mdpi':48,
            'hdpi':72,
            'xhdpi':96,
            'xxhdpi':144,
            'xxxhdpi':192
          }

          for density,size in sizes.items():
            d=Path(f'app/src/main/res/mipmap-{density}')
            d.mkdir(parents=True,exist_ok=True)

            icon.resize((size,size),Image.Resampling.LANCZOS).save(
              d/'ic_launcher.png'
            )
            icon.resize((size,size),Image.Resampling.LANCZOS).save(
              d/'ic_launcher_round.png'
            )

          print("Ícone redondo e tela horizontal configurados")
          PY

      - name: Compilar APK
        working-directory: fonte_extraida/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-150Fases-Fullscreen-IconRedondo
          path: fonte_extraida/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
