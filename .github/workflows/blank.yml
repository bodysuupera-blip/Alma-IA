
name: ALMA IA 6.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  compilar:
    name: Compilador ALMA IA 6.0
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -eo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -60
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -eo pipefail

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir arquivos do ALMA IA
        shell: bash
        run: |
          set -euo pipefail

          for f in settings.gradle build.gradle app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/index.html \
            app/src/main/assets/augusto.jpg \
            app/src/main/assets/helena.jpg \
            app/src/main/assets/gabriel.jpg \
            app/src/main/java/com/almaia/app/MainActivity.java
          do
            if [ ! -s "$f" ]; then
              echo "ERRO: arquivo não encontrado: $f"
              find . -maxdepth 5 -type f | head -100
              exit 1
            fi
          done

          echo "Arquivos verificados!"

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-6.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
