
name: ALMA IA 3.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        run: |
          set -e
          if [ ! -f settings.gradle ]; then
            ZIP=$(find . -maxdepth 3 -name "ALMA_IA_3_0_PROJETO_ANDROID.zip" -print -quit)
            if [ -z "$ZIP" ]; then
              echo "ZIP do projeto não encontrado"
              exit 1
            fi
            mkdir -p projeto-extraido
            unzip -oq "$ZIP" -d projeto-extraido
            ROOT=$(find projeto-extraido -name settings.gradle -print -quit | xargs dirname)
            cp -a "$ROOT"/. .
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
