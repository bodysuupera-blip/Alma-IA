
name: NEXUS 350 - APK 100 FASES AUTOMATICO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Localizar e extrair ZIP da fonte
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name "Nexus350_FONTE_NOVA_100_FASES.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f \
              -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          echo "Fonte selecionada: $ZIP"

          mkdir -p fonte_extraida
          unzip -oq "$ZIP" -d fonte_extraida

          PACKAGE=$(find fonte_extraida -type f \
            -name package.json | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: ZIP não contém package.json"
            find fonte_extraida -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: npm install
        working-directory: fonte_extraida

      - name: Preparar Android
        working-directory: fonte_extraida
        run: |
          npx cap add android

      - name: Sincronizar Capacitor
        working-directory: fonte_extraida
        run: npx cap sync android

      - name: Compilar APK
        working-directory: fonte_extraida/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-100Fases
          path: fonte_extraida/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
