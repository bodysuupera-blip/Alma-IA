
name: ALMA IA 7.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilador ALMA IA 7.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto ALMA IA 7.0
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ALMA_IA_7_0_TEXTO_SEM_MICROFONE.zip"

          if [ ! -s "$ZIP" ]; then
            echo "ERRO: ZIP da ALMA IA 7.0 não encontrado."
            ls -lah
            exit 1
          fi

          rm -rf build_alma7
          mkdir -p build_alma7
          unzip -q "$ZIP" -d build_alma7

          PROJECT="build_alma7/alma7_work"

          if [ ! -f "$PROJECT/settings.gradle" ] || \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERRO: Estrutura Android inválida."
            find build_alma7 -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir versão 7.0
        shell: bash
        run: |
          set -euo pipefail

          BUILD="$PROJECT_DIR/app/build.gradle"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -q "versionCode 7" "$BUILD"
          grep -q "versionName '7.0'" "$BUILD"

          if grep -q "RECORD_AUDIO" "$MANIFEST"; then
            echo "ERRO: Permissão de microfone encontrada."
            exit 1
          fi

          echo "Versão 7.0 confirmada."
          echo "Microfone não solicitado."

      - name: Compilar APK ALMA IA 7.0
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK GERADO:"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK 7.0
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-IA-7.0-APK-NOVA-VERSAO
          path: build_alma7/alma7_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
